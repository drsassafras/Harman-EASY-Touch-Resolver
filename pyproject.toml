[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["custom_components"]

# Newer Home Assistant versions re-export names with `# noqa: F401` instead of `__all__`
# (for example BinarySensorDeviceClass from 2026.10), which strict mode would reject.
[[tool.mypy.overrides]]
module = "homeassistant.*"
implicit_reexport = true
