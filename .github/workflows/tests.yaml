name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - run: pytest --cov=custom_components.harman_easytouch_resolver --cov-report=term-missing

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt mypy
      - run: mypy
